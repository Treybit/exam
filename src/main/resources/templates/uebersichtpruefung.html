<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <link href="../static/css/bootstrap.min.css" rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">
    <script src="../../static/js/bootstrap.bundle.min.js"
            th:src="@{/js/bootstrap.bundle.min.js}">
    </script>
    <meta charset="UTF-8">
    <title>Übersicht Prüfungen</title>
</head>
<body>

<header th:replace="~{fragments/header :: header}">
    <!-- Hier soll später eine Navbar rein-->
</header>

<main class="container">
    <h1>Übersicht Prüfungen</h1>

    <!-- Damit auf dem Handy die Tabelle verschoben werden kann -->
    <div class="table-responsive">

        <table class="table table-striped">

            <thead>
            <tr>
                <th>Titel</th>
                <th>Beschreibung</th>
                <th>Erstellt von</th>
                <th>Erstellt am</th>
                <th>Anzahl Fragen</th>
                <th>Öffnen</th>
                <th>Löschen</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="pruefung : ${pruefungen}">

                <td th:text="${pruefung.titel}"></td>
                <td th:text="${pruefung.beschreibung}"></td>
                <td th:text="${pruefung.erstelltVon}"></td>
                <td th:text="${pruefung.erstelltAmToString}"></td>
                <td th:text="${pruefung.anzahlFragen}"></td>

                <td>
                    <a th:href="@{/pruefung/{id}(id=${pruefung.id})}">
                        Öffnen
                    </a>
                </td>

                <td>
                    <a th:href="@{/pruefung/loeschen/{id}(id=${pruefung.id})}">
                        Löschen
                    </a>
                </td>

            </tr>
            </tbody>

        </table>

    </div>


    <p>
        <a th:href="@{/pruefung/erstellen}">Prüfung erstellen</a>
        <a th:href="@{/}">Abbrechen</a>
    </p>

</main>

<footer th:replace="~{fragments/footer :: footer}">
    <!-- Hier soll später ein Footer rein -->
</footer>

</body>
</html>
